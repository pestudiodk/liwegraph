name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'pestudiodk/liwegraph' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Cache Semgrep packages
        uses: actions/cache@5a3ec84eff668545fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-semgrep-1.175.0
      - name: Install Semgrep
        run: |
          python3 -m pip install --user semgrep==1.175.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm test
      - name: Pack exact release tarball
        run: |
          npm run build
          npm pack --pack-destination /tmp
          version=$(node -p "require('./package.json').version")
          echo "LIWEGRAPH_TARBALL=/tmp/pestudiodk-liwegraph-${version}.tgz" >> "$GITHUB_ENV"
      - name: Publish exact tarball
        run: npm publish "$LIWEGRAPH_TARBALL" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
